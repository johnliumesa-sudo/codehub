<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Channel word cloud</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { padding: 14px; background: var(--ch-bg-1, #11141b); color: var(--ch-text, #e6e9f0); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
  h1 { margin: 0; font-size: 14px; }
  .sub { color: var(--ch-text-dim, #9aa3b5); font-size: 12px; margin: 2px 0 0; }
  button { padding: 5px 10px; border-radius: 6px; border: 1px solid var(--ch-border, #262d3d); background: var(--ch-bg-3, #1d2230); color: inherit; font: inherit; font-size: 12px; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--ch-accent, #5b8cff); outline-offset: 2px; }
  #cloud { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: center; gap: 4px 10px; padding: 12px 4px; margin: 0; list-style: none; }
  #cloud li { line-height: 1.1; font-weight: 600; }
  #cloud li span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .c0 { color: var(--ch-accent, #5b8cff); } .c1 { color: var(--ch-accent-2, #a66bff); } .c2 { color: var(--ch-ok, #3ccf91); }
  .c3 { color: var(--ch-warn, #f5c542); } .c4 { color: var(--ch-text, #e6e9f0); } .c5 { color: var(--ch-danger, #ff5c7a); }
  .empty { color: var(--ch-text-dim, #9aa3b5); text-align: center; padding: 24px 8px; }
</style>
</head>
<body>
  <header>
    <div>
      <h1 id="title">Word cloud</h1>
      <p class="sub" id="sub" aria-live="polite">Loading…</p>
    </div>
    <button type="button" id="refresh">Refresh</button>
  </header>
  <ul id="cloud" aria-label="Most used words"></ul>
<script>
(function () {
  var STOP = ('a about after again all also am an and any are as at be because been before being but by can could did do does ' +
    'doing done for from get got had has have he her here him his how i if im in into is it its ive just let lets like me more ' +
    'most my no not now of off ok okay on one only or other our out over please really same see she should so some still such ' +
    'than thanks that thats the their them then there these they this those though through to too up us very was we were what ' +
    'when where which while who why will with would yeah yes you your youre dont cant wont isnt didnt doesnt').split(' ');
  var stop = {};
  STOP.forEach(function (w) { stop[w] = true; });
  var cloud = document.getElementById('cloud');
  var sub = document.getElementById('sub');
  var timer = null;

  function words(text) {
    return text
      .replace(/```[\s\S]*?```/g, ' ')
      .replace(/`[^`]*`/g, ' ')
      .replace(/https?:\/\/\S+/g, ' ')
      .replace(/[@#][\w-]+/g, ' ')
      .toLowerCase()
      .replace(/[’']/g, '')
      .split(/[^\p{L}\p{N}]+/u)
      .filter(function (w) { return w.length > 2 && !stop[w] && !/^\d+$/.test(w); });
  }

  function draw(messages) {
    var counts = {};
    messages.forEach(function (m) { words(m.text).forEach(function (w) { counts[w] = (counts[w] || 0) + 1; }); });
    var top = Object.keys(counts).sort(function (a, b) { return counts[b] - counts[a] || a.localeCompare(b); }).slice(0, 40);
    cloud.textContent = '';
    if (!top.length) {
      var li = document.createElement('li');
      li.className = 'empty';
      li.textContent = 'No words to show yet. Say something!';
      cloud.appendChild(li);
      return;
    }
    var max = counts[top[0]], min = counts[top[top.length - 1]];
    top.sort(function (a, b) { return a.localeCompare(b); }).forEach(function (w, i) {
      var li = document.createElement('li');
      var t = max === min ? 0.5 : (counts[w] - min) / (max - min);
      li.style.fontSize = (12 + Math.round(t * 22)) + 'px';
      li.className = 'c' + (i % 6);
      li.textContent = w;
      var n = document.createElement('span');
      n.textContent = ', used ' + counts[w] + (counts[w] === 1 ? ' time' : ' times');
      li.appendChild(n);
      li.title = counts[w] + ' × ' + w;
      cloud.appendChild(li);
    });
  }

  function refresh() {
    return codehub.getMessages(100).then(function (messages) {
      draw(messages);
      sub.textContent = 'From the last ' + messages.length + ' message' + (messages.length === 1 ? '' : 's') + '.';
    }).catch(function (e) {
      sub.textContent = e.code === 'PERMISSION_DENIED' ? 'This add-on needs the “Read messages” permission.' : 'Could not read messages: ' + e.message;
    });
  }

  document.getElementById('refresh').addEventListener('click', refresh);
  codehub.on('messages', function () { clearTimeout(timer); timer = setTimeout(refresh, 800); });
  codehub.on('context', function (c) { document.getElementById('title').textContent = 'Word cloud · ' + (c.kind === 'channel' ? '#' : '') + c.name; refresh(); });
  codehub.ready().then(function (info) {
    var c = info.context || {};
    document.getElementById('title').textContent = 'Word cloud' + (c.name ? ' · ' + (c.kind === 'channel' ? '#' : '') + c.name : '');
    return refresh();
  });
})();
</script>
</body>
</html>
