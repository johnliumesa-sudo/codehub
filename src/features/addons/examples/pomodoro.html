<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pomodoro timer</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    padding: 16px; background: var(--ch-bg-1, #11141b); color: var(--ch-text, #e6e9f0);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .modes { display: flex; gap: 4px; padding: 3px; border-radius: 999px; background: var(--ch-bg-3, #1d2230); }
  .modes button { border: 0; border-radius: 999px; padding: 5px 10px; background: transparent; color: var(--ch-text-dim, #9aa3b5); font: inherit; font-size: 12px; cursor: pointer; }
  .modes button[aria-pressed="true"] { background: var(--ch-accent, #5b8cff); color: #fff; }
  .ring { position: relative; width: 180px; height: 180px; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 10; }
  .ring .track { stroke: var(--ch-bg-3, #1d2230); }
  .ring .bar { stroke: var(--ch-accent, #5b8cff); stroke-linecap: round; transition: stroke-dashoffset .25s linear; }
  body.break .ring .bar { stroke: var(--ch-ok, #3ccf91); }
  .time { position: absolute; inset: 0; display: grid; place-items: center; font-size: 40px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .controls { display: flex; gap: 8px; }
  .controls button { min-width: 84px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--ch-border, #262d3d); background: var(--ch-bg-3, #1d2230); color: inherit; font: inherit; cursor: pointer; }
  .controls button.primary { background: var(--ch-accent, #5b8cff); border-color: var(--ch-accent, #5b8cff); color: #fff; }
  button:focus-visible { outline: 2px solid var(--ch-accent, #5b8cff); outline-offset: 2px; }
  .meta { color: var(--ch-text-dim, #9aa3b5); font-size: 12px; text-align: center; }
  @media (prefers-reduced-motion: reduce) { .ring .bar { transition: none; } }
</style>
</head>
<body>
  <div class="modes" role="group" aria-label="Timer mode">
    <button type="button" data-mode="focus">Focus</button>
    <button type="button" data-mode="short">Short break</button>
    <button type="button" data-mode="long">Long break</button>
  </div>
  <div class="ring">
    <svg viewBox="0 0 120 120" aria-hidden="true"><circle class="track" cx="60" cy="60" r="52"></circle><circle class="bar" cx="60" cy="60" r="52"></circle></svg>
    <div class="time" id="time" role="timer" aria-live="off">25:00</div>
  </div>
  <div class="controls">
    <button type="button" class="primary" id="toggle">Start</button>
    <button type="button" id="reset">Reset</button>
  </div>
  <p class="meta" id="meta" aria-live="polite"></p>
<script>
(function () {
  var MODES = { focus: 25 * 60, short: 5 * 60, long: 15 * 60 };
  var LABEL = { focus: 'Focus', short: 'Short break', long: 'Long break' };
  var C = 2 * Math.PI * 52;
  var state = { mode: 'focus', endsAt: 0, left: MODES.focus, done: 0 };
  var canStore = false;
  var bar = document.querySelector('.bar');
  var timeEl = document.getElementById('time');
  var toggle = document.getElementById('toggle');
  var meta = document.getElementById('meta');
  bar.style.strokeDasharray = String(C);

  function remaining() { return state.endsAt ? Math.max(0, Math.round((state.endsAt - Date.now()) / 1000)) : state.left; }
  function fmt(s) { var m = Math.floor(s / 60), r = s % 60; return (m < 10 ? '0' : '') + m + ':' + (r < 10 ? '0' : '') + r; }
  function save() { if (canStore) codehub.storage.set('state', state).catch(function () {}); }
  function say(text) { meta.textContent = text; }

  function render() {
    var left = remaining();
    timeEl.textContent = fmt(left);
    bar.style.strokeDashoffset = String(C * (1 - left / MODES[state.mode]));
    toggle.textContent = state.endsAt ? 'Pause' : left < MODES[state.mode] ? 'Resume' : 'Start';
    document.body.classList.toggle('break', state.mode !== 'focus');
    document.querySelectorAll('[data-mode]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.mode === state.mode)); });
    document.title = fmt(left) + ' · ' + LABEL[state.mode];
  }

  function chime() {
    try {
      var ac = new (window.AudioContext || window.webkitAudioContext)();
      [0, 0.25, 0.5].forEach(function (t) {
        var o = ac.createOscillator(), g = ac.createGain();
        o.frequency.value = 880; o.connect(g); g.connect(ac.destination);
        g.gain.setValueAtTime(0.0001, ac.currentTime + t);
        g.gain.exponentialRampToValueAtTime(0.2, ac.currentTime + t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + t + 0.2);
        o.start(ac.currentTime + t); o.stop(ac.currentTime + t + 0.22);
      });
    } catch (e) { /* no audio */ }
  }

  function setMode(mode) { state.mode = mode; state.endsAt = 0; state.left = MODES[mode]; save(); render(); }

  function finish() {
    chime();
    if (state.mode === 'focus') {
      state.done += 1;
      setMode(state.done % 4 === 0 ? 'long' : 'short');
      say('Focus session done. Time for a break. Sessions today: ' + state.done + '.');
    } else {
      setMode('focus');
      say('Break over. Ready for the next focus session?');
    }
  }

  toggle.addEventListener('click', function () {
    if (state.endsAt) { state.left = remaining(); state.endsAt = 0; say('Paused.'); }
    else { state.endsAt = Date.now() + remaining() * 1000; say(LABEL[state.mode] + ' started.'); }
    save(); render();
  });
  document.getElementById('reset').addEventListener('click', function () { setMode(state.mode); say('Reset.'); });
  document.querySelectorAll('[data-mode]').forEach(function (b) {
    b.addEventListener('click', function () { setMode(b.dataset.mode); say(LABEL[b.dataset.mode] + ' selected.'); });
  });

  setInterval(function () {
    if (state.endsAt && remaining() === 0) finish();
    else render();
  }, 250);

  render();
  codehub.ready().then(function (info) {
    canStore = info.perms.indexOf('storage') >= 0;
    if (!canStore) { say('Storage permission not granted: the timer resets when the panel closes.'); return; }
    return codehub.storage.get('state').then(function (saved) {
      if (saved && MODES[saved.mode]) {
        state = { mode: saved.mode, endsAt: Number(saved.endsAt) || 0, left: Math.min(MODES[saved.mode], Number(saved.left) || MODES[saved.mode]), done: Number(saved.done) || 0 };
        if (state.endsAt && state.endsAt <= Date.now()) finish();
        render();
      }
      say('Sessions completed: ' + state.done + '. Your timer keeps running while this panel is closed.');
    });
  }).catch(function (e) { say('Could not load your saved timer: ' + e.message); });
})();
</script>
</body>
</html>
